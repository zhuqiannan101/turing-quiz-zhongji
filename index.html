  else{o.frequency.setValueAtTime(300,c.currentTime);o.frequency.setValueAtTime(210,c.currentTime+.12)}
  g.gain.setValueAtTime(.18,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.3);
  o.start();o.stop(c.currentTime+.32);setTimeout(()=>c.close(),400)}catch(e){}
}
function toggleSnd(){snd=!snd;document.getElementById("snd").textContent=snd?"🔊":"🔇"}
const SFXDATA={"coin": "sfx/coin.mp3", "double": "sfx/double.mp3", "triple": "sfx/triple.mp3", "quadra": "sfx/quadra.mp3", "penta": "sfx/penta.mp3", "legendary": "sfx/legendary.mp3", "welcome": "sfx/welcome.mp3", "fail": "sfx/fail.mp3"};
const sfxBuf={};
function actx(){
 if(!actx._c){try{actx._c=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
 if(actx._c&&actx._c.state==="suspended")try{actx._c.resume()}catch(e){}
 return actx._c;
}
function playSfx(name){
 const c=actx();if(!c||!snd)return;
 if(sfxBuf[name]){const s=c.createBufferSource();s.buffer=sfxBuf[name];s.connect(c.destination);s.start();return}
 try{
  fetch(SFXDATA[name]).then(r=>r.arrayBuffer()).then(ab=>c.decodeAudioData(ab)).then(buf=>{
   sfxBuf[name]=buf;
   const s=c.createBufferSource();s.buffer=buf;s.connect(c.destination);s.start();
  }).catch(e=>{});
 }catch(e){}
}
function beep(ok){playSfx(ok?"coin":"fail")}
function killSfx(c){playSfx({2:"double",3:"triple",4:"quadra",5:"penta",6:"legendary"}[c]||"coin")}
function fanfare(){playSfx("welcome")}
function killPop(t){
 const k=document.getElementById("killb");k.textContent=t;
 k.classList.remove("show");void k.offsetWidth;k.classList.add("show");
}
function killWord(c){
 if(c>=6)return"LEGENDARY!";
 if(c===5)return"PENTA KILL!";
 if(c===4)return"QUADRA KILL!";
 if(c===3)return"TRIPLE KILL!";
 if(c===2)return"DOUBLE KILL!";
 if(c===1)return"FIRST BLOOD!";
 return null;
}
function addCoins(n,anchorEl){
 coins+=n;const el=document.getElementById("coinN");
 el.textContent=coins;
 const bar=document.getElementById("coinbar");bar.classList.remove("bump");void bar.offsetWidth;bar.classList.add("bump");
 if(anchorEl){const f=document.createElement("div");f.className="coinfly";f.textContent="+"+n+" 🪙";
  anchorEl.appendChild(f);setTimeout(()=>f.remove(),1200)}
}
function start(mode){
 if(mode==="wrong"){
   order=shuffled([...wrong]).slice(0,15);
   if(!order.length){alert("错题本是空的，太厉害啦！🎉");return}
 }else order=shuffled([...QUIZ.keys()]).slice(0,15);
 cur=0;ansMap={};coins=0;combo=0;
 document.getElementById("coinN").textContent="0";
 show(["quiz"]);render();
 killPop("WELCOME!");
 fanfare();
}
function preload(i){if(i===null||i===undefined||i<0||i>=order.length)return;
 try{const q=QUIZ[order[i]];const im1=new Image();im1.src=q.q;const im2=new Image();im2.src=q.a}catch(e){}}
function show(ids){for(const id of["home","quiz","ans","result"])document.getElementById(id).classList.toggle("hidden",!ids.includes(id));
 document.getElementById("homeIc").classList.toggle("hidden",!ids.some(i=>i!=="home"))}
function goHome(){show(["home"]);renderProg()}
function render(){
 const q=QUIZ[order[cur]];
 document.getElementById("pPlate").textContent=q.plate;
 document.getElementById("pPlate").style.background=q.color;
 document.getElementById("pIdx").textContent=`第 ${cur+1} / ${order.length} 关`;
 document.getElementById("pBar").style.width=(cur/order.length*100)+"%";
 document.getElementById("pRocket").style.left=`calc(${cur/order.length*100}% - 9px)`;
 document.getElementById("qImg").src=q.q;
 const opts=document.getElementById("opts");opts.innerHTML="";
 for(const L of["A","B","C","D"]){
   const b=document.createElement("button");b.className="opt";b.textContent=L;b.onclick=()=>pick(L);
   if(ansMap[cur]!==undefined)b.disabled=true;
   if(ansMap[cur]!==undefined){
     if(L===q.ans)b.classList.add("ok");
     else if(L===ansMap[cur])b.classList.add("bad");
   }
   opts.appendChild(b);
 }
 const fb=document.getElementById("fb");
 if(ansMap[cur]!==undefined){
   const ok=ansMap[cur]===q.ans;
   fb.className="fb "+(ok?"ok":"bad");
   fb.innerHTML=ok
     ?`${PRAISE[Math.floor(Math.random()*PRAISE.length)]}${combo>=3?`<span class="combo">🔥 连对 ${combo} 题！</span>`:""}<span style="float:right">答对 +3 金币</span>`
     :`${CHEER[Math.floor(Math.random()*CHEER.length)]} <span style="float:right">正确答案：${q.ans}</span>`;
   document.getElementById("acts").style.display="flex";
 }else{fb.className="fb";document.getElementById("acts").style.display="none"; preload(cur+1)}
}
function pick(L){
 if(ansMap[cur]!==undefined)return;
 const q=QUIZ[order[cur]];
 ansMap[cur]=L;
 const ok=L===q.ans;
 if(ok){
   combo++;addCoins(3,document.getElementById("fb"));
   const kw=killWord(combo);
   if(kw){killPop(kw);killSfx(Math.min(combo,6))}
   else{beep(true)}
 }else{
   combo=0;wrong.add(order[cur]);saveWrong();beep(false);
 }
 render();
}
function showAns(){
 const q=QUIZ[order[cur]];
 document.getElementById("aPlate").textContent=q.plate;
 document.getElementById("aPlate").style.background=q.color;
 document.getElementById("aIdx").textContent=`第 ${cur+1} / ${order.length} 关`;
 document.getElementById("aImg").src=q.a;
 document.getElementById("aPoint").textContent="🎯 考点："+q.point;
 show(["ans"]);
}
function next(){
 cur++;
 if(cur>=order.length){result();return}
 if(document.getElementById("quiz").classList.contains("hidden"))show(["quiz"]);
 render();
}
function confetti(){
 const colors=["#FF7043","#FFA726","#66BB6A","#26A69A","#42A5F5","#AB47BC","#EC407A","#FFD54F"];
 for(let i=0;i<46;i++){
   const c=document.createElement("div");c.className="confetti";
   c.style.left=Math.random()*100+"vw";
   c.style.width=c.style.height=(6+Math.random()*8)+"px";
   c.style.background=colors[Math.floor(Math.random()*colors.length)];
   c.style.animationDuration=(2.2+Math.random()*2)+"s";
   c.style.animationDelay=Math.random()*.7+"s";
   document.body.appendChild(c);setTimeout(()=>c.remove(),5200);
 }
}
function result(){
 let ok=0,bad=0;
 for(const k in ansMap){if(ansMap[k]===QUIZ[order[k]].ans)ok++;else bad++}
 document.getElementById("rOk").textContent=ok;
 document.getElementById("rBad").textContent=bad;
 const rate=Math.round(ok/(ok+bad)*100)||0;
 document.getElementById("rRate").textContent=rate+"%";
 document.getElementById("rCoin").textContent=ok*3;
 document.getElementById("rStars").textContent=rate>=90?"⭐⭐⭐⭐⭐":rate>=75?"⭐⭐⭐⭐":rate>=60?"⭐⭐⭐":rate>=40?"⭐⭐":"⭐";
 show(["result"]);
 if(ok>0){confetti();beep(true)}
 sendFeishu(ok, ok+bad);
}
function renderProg(){
 const total=QUIZ.length,w=wrong.size;
 document.getElementById("prog").innerHTML=
  `<div style="display:flex;gap:14px;flex-wrap:wrap;text-align:center">
   <div style="flex:1;min-width:150px">📚 题库总量：<b>${total}</b> 题</div>
   <div style="flex:1;min-width:150px">🔁 错题本：<b style="color:#e05252">${w}</b> 题</div>
   <div style="flex:1;min-width:150px">✅ 已掌握：<b style="color:#3cb371">${total-w}</b> 题</div>
  </div>`;
}
renderProg();renderName();
</script></body></html>
